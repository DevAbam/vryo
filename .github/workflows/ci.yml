name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint, types, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-and-e2e:
    name: Migrations, RLS, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start local Supabase (applies migrations to a clean database)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Export local Supabase env
        run: |
          npx supabase status -o env | sed 's/"//g' | grep -E '^[A-Z_]+=' >> "$GITHUB_ENV"

      - name: Re-apply migrations from scratch
        run: npx supabase db reset

      - name: Check generated database types match migrations
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts

      - name: RLS and database tests
        run: npm run test:db
        env:
          REQUIRE_DB_TESTS: "1"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY || env.ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Check server secrets are not in client bundles
        run: |
          if grep -rlE "SUPABASE_SERVICE_ROLE_KEY|RATE_LIMIT_SALT|rate_limit_hit" .next/static; then
            echo "Server-only identifiers found in client bundles" >&2
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY || env.ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY || env.SERVICE_ROLE_KEY }}
          RATE_LIMIT_SALT: ci-only-rate-limit-salt-not-secret

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
